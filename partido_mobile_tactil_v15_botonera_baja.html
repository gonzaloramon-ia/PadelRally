<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PADEL RALLY — Piloto táctil V15 Botonera baja</title>
<style>
:root{color-scheme:dark;--side:clamp(170px,14vw,200px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;color:#eaf6ff;font:14px system-ui,Segoe UI,sans-serif;overscroll-behavior:none}
body{display:grid;place-items:center;height:100vh;height:100dvh;touch-action:none}
main{position:relative;width:min(100vw,calc(100dvh * 1672 / 941));height:auto;max-width:none;max-height:100dvh;aspect-ratio:1672/941;margin:auto;display:flex;align-items:center;justify-content:center;background:#050a12;overflow:hidden}
main:fullscreen{width:100%;height:100%;max-width:none;max-height:none;aspect-ratio:auto;background:#050a12}
canvas{display:block;max-height:100%;max-width:100%;width:100%;height:auto;aspect-ratio:1672/941;outline:none;object-fit:contain;touch-action:none}
#status{position:absolute;left:-9999px}

#mobile-fullscreen{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:40;background:#0b63a9ed;border:1px solid #64d7ff;color:#fff;border-radius:12px;padding:12px 18px;font:800 13px system-ui,Segoe UI,sans-serif;letter-spacing:.04em;cursor:pointer;box-shadow:0 4px 20px #0009;min-width:210px;touch-action:manipulation}
#mobile-fullscreen:active{transform:translateX(-50%) scale(.98)}
#mobile-fullscreen[hidden]{display:none!important}

.touch-panel{position:absolute;top:0;bottom:0;width:var(--side);z-index:30;display:none;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.touch-panel.left{left:0;transform:translateY(-58px)}.touch-panel.right{right:0}
main.mobile-active .touch-panel{display:flex}
main.mobile-active canvas{
  --mobile-zoom:1.17;
  --camera-y:-4%;
  transform:scale(var(--mobile-zoom)) translateY(var(--camera-y));
  transform-origin:center center;
}
.touch-panel button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:#fff;background:#12283dc9;border:1px solid #8bc5e8aa;box-shadow:0 2px 8px #0008;border-radius:18px;font:800 14px/1 system-ui,Segoe UI,sans-serif;min-width:58px;min-height:58px;padding:0;display:grid;place-items:center}
.touch-panel button.active,.touch-panel button:active{background:#1e6697e8;border-color:#bceaff;transform:scale(.96)}

.joystick-wrap{width:min(150px,100%);aspect-ratio:1/1;display:grid;place-items:center;padding:4px}
.joystick-base{pointer-events:auto;position:relative;width:132px;height:132px;border-radius:50%;background:#12283dc9;border:2px solid #8bc5e8aa;box-shadow:0 2px 12px #0009;touch-action:none;user-select:none;-webkit-user-select:none}
.joystick-base::before{content:"";position:absolute;inset:18px;border-radius:50%;border:1px solid #8bc5e855}
.joystick-base::after{content:"RUN";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:800 10px/1 system-ui,Segoe UI,sans-serif;color:#b9d8ecaa;letter-spacing:.08em;pointer-events:none}
.joystick-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#1b4667e8;border:2px solid #b9e3f5cc;box-shadow:0 3px 10px #0008;display:grid;place-items:center;font:900 22px/1 system-ui;color:white;pointer-events:none;transform:translate(0,0)}
.joystick-label{position:absolute;inset:0;pointer-events:none;font:800 13px/1 system-ui;color:#d8eefbbb}
.joystick-label span{position:absolute}
.joystick-label .n{top:8px;left:50%;transform:translateX(-50%)}.joystick-label .s{bottom:23px;left:50%;transform:translateX(-50%)}.joystick-label .w{left:9px;top:50%;transform:translateY(-50%)}.joystick-label .e{right:9px;top:50%;transform:translateY(-50%)}

.shots{
display:grid;
grid-template-columns:repeat(2,40px);
grid-template-rows:repeat(6,40px);
gap:5px 7px;
width:auto;
padding:2px 6px 2px 2px;
align-content:center;
justify-content:end;
}
.shots .rev{grid-column:2;grid-row:1}
.shots .der{grid-column:2;grid-row:2}
.shots .lob{grid-column:2;grid-row:3}
.shots .smash{grid-column:2;grid-row:4}
.shots .drop{grid-column:2;grid-row:5}
.shots .glass{grid-column:2;grid-row:6}
.shots .btn-a{grid-column:1;grid-row:1}
.shots .btn-d{grid-column:1;grid-row:2}
.shots button{width:40px;height:40px;aspect-ratio:auto;min-width:40px;min-height:40px;font-size:9px;line-height:1.0;padding:2px;justify-self:center}
.shots .smash{font-size:8px}.shots .lob{font-size:8px}.shots .drop{font-size:8px}.shots .glass{font-size:8px}



#camera-toggle{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:36;display:none;width:56px;height:38px;border-radius:10px;border:1px solid #8bc5e8aa;background:#07131ed9;color:#fff;font:800 11px system-ui;touch-action:manipulation}
main.mobile-active #camera-toggle{display:block}
#camera-panel{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:37;display:none;align-items:center;gap:7px;background:#07131ee8;border:1px solid #ffffff2d;border-radius:12px;padding:6px 8px;pointer-events:auto}
main.mobile-active #camera-panel.open{display:flex}
main.mobile-active #camera-panel.open + #camera-toggle{display:none}
#camera-panel button{width:42px;height:42px;border-radius:10px;border:1px solid #8bc5e8aa;background:#12283de8;color:#fff;font:900 18px/1 system-ui;touch-action:manipulation}
#camera-panel .close{width:36px;font-size:16px}
#zoom-value{min-width:54px;text-align:center;font:800 12px system-ui;color:#dff4ff}
#mobile-note{position:absolute;left:50%;top:7px;transform:translateX(-50%);z-index:31;display:none;color:#d8efff;background:#07131ec7;border:1px solid #ffffff2d;border-radius:8px;padding:4px 8px;font:700 10px system-ui,Segoe UI,sans-serif;pointer-events:none;white-space:nowrap}
main.mobile-active #mobile-note{display:block}


.touch-panel.right,.shots-panel{transform:translateY(-38px);justify-content:flex-end;padding-right:2px}
@media (max-height:330px){.touch-panel.left{transform:translateY(-42px)}.touch-right{transform:translateY(-24px)}:root{--side:150px}.touch-panel button{border-radius:15px;min-width:52px;min-height:52px}.joystick-wrap{width:min(154px,100%);padding:4px}.joystick-base{width:136px;height:136px}.joystick-knob{width:60px;height:60px;margin:-30px 0 0 -30px}.shots{gap:8px;padding:7px}.shots button{font-size:10px}#mobile-note{display:none!important}}
@media (pointer:fine){#mobile-fullscreen{opacity:.88}}
</style>
</head>
<body>
<main id="stage">
  <canvas id="game" width="1672" height="941" tabindex="0" aria-label="PADEL RALLY táctil"></canvas>
  <div id="status" aria-live="polite">Cargando recursos</div>
  <button id="mobile-fullscreen" type="button">JUGAR EN PANTALLA COMPLETA</button>
  <div id="mobile-note">Mantené el golpe para cargar potencia · soltá para pegar</div>

  <section class="touch-panel left" aria-label="Movimiento táctil">
    <div class="joystick-wrap">
      <div id="joystick" class="joystick-base" role="application" aria-label="Joystick de movimiento">
        <div class="joystick-label"><span class="n">▲</span><span class="s">▼</span><span class="w">◀</span><span class="e">▶</span></div>
        <div id="joystickKnob" class="joystick-knob">●</div>
      </div>
    </div>
  </section>

  <section class="touch-panel right" aria-label="Golpes táctiles">
    <div class="shots">
      <button class="rev" type="button" data-code="KeyZ" aria-label="Revés">REV</button>
      <button class="der" type="button" data-code="KeyX" aria-label="Derecha">DER</button>
      <button class="lob" type="button" data-code="KeyC" aria-label="Globo">GLOBO</button>
      <button class="smash" type="button" data-code="Space" aria-label="Golpes aéreos">AÉR</button>
      <button class="drop" type="button" data-code="KeyV" aria-label="Juego corto y red">RED</button>
      <button class="glass" type="button" data-code="KeyS" aria-label="Contrapared de fondo">VIDRIO</button>
      <button class="btn-a" type="button" data-code="KeyA" aria-label="Golpe A">A</button>
      <button class="btn-d" type="button" data-code="KeyD" aria-label="Golpe D">D</button>
    </div>
  </section>

  <div id="camera-panel" class="open" aria-label="Controles de cámara">
    <button id="zoom-out" type="button" aria-label="Alejar">−</button>
    <span id="zoom-value">117%</span>
    <button id="zoom-in" type="button" aria-label="Acercar">+</button>
    <button id="camera-down" type="button" aria-label="Bajar cámara">▼</button>
    <button id="camera-up" type="button" aria-label="Subir cámara">▲</button>
    <button id="camera-close" class="close" type="button" aria-label="Cerrar controles de cámara">×</button>
  </div>
  <button id="camera-toggle" type="button" aria-label="Abrir controles de cámara">CAM</button>
</main>

<script>
// Piloto mobile: arranca directo en Normal + Medio sin modificar game.js.
(()=>{
  const u=new URL(location.href);
  if(!u.searchParams.has('fromMenu')){
    u.searchParams.set('fromMenu','1');
    u.searchParams.set('tempo','1');
    u.searchParams.set('skill','1');
    history.replaceState(null,'',u);
  }
})();
</script>
<script src="controls.js"></script>
<script src="assets.js"></script>
<script src="audio.js"></script>
<script src="yellow.js"></script>
<script>
window.PADEL_A44_ENABLED = new URLSearchParams(location.search).get('original') !== '1';
window.PADEL_A44_YELLOW = new URLSearchParams(location.search).get('yellownew') === '1';
window.PADEL_A45_ENABLED = window.PADEL_A44_ENABLED;
window.PADEL_A45_YELLOW_OLD = new URLSearchParams(location.search).get('yellowold') === '1';
</script>
<script src="a44-sprites.js"></script>
<script src="a45-sprites.js"></script>
<script src="a48-sprites.js"></script>
<script>window.PADEL_A48_ENABLED = window.PADEL_A45_ENABLED && !new URLSearchParams(location.search).has('a47visual');</script>
<script src="game.js"></script>
<script>
(()=>{
  const stage=document.getElementById('stage');
  const full=document.getElementById('mobile-fullscreen');
  const held=new Set();

  const canvas=document.getElementById('game');
  const zoomOut=document.getElementById('zoom-out');
  const zoomIn=document.getElementById('zoom-in');
  const zoomValue=document.getElementById('zoom-value');
  const cameraDown=document.getElementById('camera-down');
  const cameraUp=document.getElementById('camera-up');
  const cameraPanel=document.getElementById('camera-panel');
  const cameraClose=document.getElementById('camera-close');
  const cameraToggle=document.getElementById('camera-toggle');

  let mobileZoom=1.20;
  let cameraY=-4;

  function applyCamera(){
    mobileZoom=Math.max(1.00,Math.min(1.70,mobileZoom));
    cameraY=Math.max(-14,Math.min(6,cameraY));
    canvas.style.setProperty('--mobile-zoom',mobileZoom.toFixed(2));
    canvas.style.setProperty('--camera-y',cameraY.toFixed(1)+'%');
    zoomValue.textContent=Math.round(mobileZoom*100)+'%';
  }

  zoomOut.addEventListener('click',e=>{
    e.preventDefault();
    mobileZoom-=0.05;
    applyCamera();
  });
  zoomIn.addEventListener('click',e=>{
    e.preventDefault();
    mobileZoom+=0.05;
    applyCamera();
  });

  // "Bajar cámara" muestra más la zona cercana y recorta el fondo detrás de los robots.
  cameraDown.addEventListener('click',e=>{
    e.preventDefault();
    cameraY-=1.5;
    applyCamera();
  });
  cameraUp.addEventListener('click',e=>{
    e.preventDefault();
    cameraY+=1.5;
    applyCamera();
  });
  cameraClose.addEventListener('click',e=>{
    e.preventDefault();
    cameraPanel.classList.remove('open');
  });
  cameraToggle.addEventListener('click',e=>{
    e.preventDefault();
    cameraPanel.classList.add('open');
  });

  applyCamera();

  function fire(type,code){
    const ev=new KeyboardEvent(type,{code,key:code==='Space'?' ':code,bubbles:true,cancelable:true});
    window.dispatchEvent(ev);
  }
  function press(code,btn){
    if(held.has(code))return;
    held.add(code);btn?.classList.add('active');fire('keydown',code);
  }
  function release(code,btn){
    if(!held.has(code))return;
    held.delete(code);btn?.classList.remove('active');fire('keyup',code);
  }
  function releaseAll(){
    document.querySelectorAll('[data-code].active').forEach(b=>b.classList.remove('active'));
    for(const code of [...held]){held.delete(code);fire('keyup',code);}
  }

  document.querySelectorAll('[data-code]').forEach(btn=>{
    const code=btn.dataset.code;
    btn.addEventListener('contextmenu',e=>e.preventDefault());
    btn.addEventListener('pointerdown',e=>{
      e.preventDefault();
      try{btn.setPointerCapture(e.pointerId);}catch(_){}
      press(code,btn);
      document.getElementById('game').focus();
    });
    const end=e=>{e.preventDefault();release(code,btn);};
    btn.addEventListener('pointerup',end);
    btn.addEventListener('pointercancel',end);
    btn.addEventListener('lostpointercapture',()=>release(code,btn));
  });
  async function enterFullscreen(){
    try{
      if(!document.fullscreenElement)await stage.requestFullscreen({navigationUI:'hide'});
      try{if(screen.orientation?.lock)await screen.orientation.lock('landscape');}catch(_){}
    }catch(_){
      full.textContent='GIRÁ EL CELULAR Y REINTENTÁ';
    }
  }
  full.addEventListener('click',enterFullscreen);
  document.addEventListener('fullscreenchange',()=>{
    const on=!!document.fullscreenElement;
    stage.classList.toggle('mobile-active',on);
    full.hidden=on;
    if(!on){releaseAll();full.hidden=false;full.textContent='JUGAR EN PANTALLA COMPLETA';}
  });
  
  // Joystick táctil: 8 direcciones. Zona exterior = correr automáticamente.
  const joystick = document.getElementById('joystick');
  const joystickKnob = document.getElementById('joystickKnob');
  let joyPointer = null;
  let joyCodes = new Set();

  function setJoyCodes(nextCodes){
    const next = new Set(nextCodes);
    for(const code of joyCodes){
      if(!next.has(code)) release(code, null);
    }
    for(const code of next){
      if(!joyCodes.has(code)) press(code, null);
    }
    joyCodes = next;
  }

  function updateJoystick(clientX, clientY){
    const r = joystick.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    const max = r.width * 0.31;
    const dead = r.width * 0.09;
    const runThreshold = r.width * 0.25;

    if(dist < dead){
      joystickKnob.style.transform = 'translate(0px,0px)';
      setJoyCodes([]);
      return;
    }

    const scale = Math.min(1, max / Math.max(dist, 1));
    const kx = dx * scale;
    const ky = dy * scale;
    joystickKnob.style.transform = `translate(${kx}px,${ky}px)`;

    const angle = Math.atan2(dy, dx);
    const x = Math.cos(angle);
    const y = Math.sin(angle);
    const codes = [];

    if(y < -0.38) codes.push('ArrowUp');
    if(y > 0.38) codes.push('ArrowDown');
    if(x < -0.38) codes.push('ArrowLeft');
    if(x > 0.38) codes.push('ArrowRight');

    // Empujar el joystick hacia el borde activa carrera, incluso en diagonal.
    if(dist >= runThreshold) codes.unshift('ShiftLeft');

    setJoyCodes(codes);
  }

  function stopJoystick(){
    setJoyCodes([]);
    joystickKnob.style.transform = 'translate(0px,0px)';
    joyPointer = null;
  }

  joystick.addEventListener('pointerdown', e => {
    e.preventDefault();
    joyPointer = e.pointerId;
    try{ joystick.setPointerCapture(e.pointerId); }catch(_){}
    updateJoystick(e.clientX, e.clientY);
    document.getElementById('game').focus();
  });
  joystick.addEventListener('pointermove', e => {
    if(e.pointerId !== joyPointer) return;
    e.preventDefault();
    updateJoystick(e.clientX, e.clientY);
  });
  joystick.addEventListener('pointerup', e => {
    if(e.pointerId !== joyPointer) return;
    e.preventDefault();
    stopJoystick();
  });
  joystick.addEventListener('pointercancel', stopJoystick);
  joystick.addEventListener('lostpointercapture', stopJoystick);
  joystick.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('blur',releaseAll);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
})();
</script>
</body>
</html>
